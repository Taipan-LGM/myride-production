# My Ride — Render Blueprint (legacy Node + Path A FastAPI)
# https://render.com/docs/infrastructure-as-code
#
# Apply: Dashboard → New → Blueprint → repo Taipan-LGM/My-Ride (master)
#
# After apply, set Dashboard secrets marked sync: false.
# Docs:
#   docs/RENDER_LEGACY.md
#   ecosystem/docs/RENDER_ECOSYSTEM.md
#   ecosystem/docs/CUTOVER.md

databases:
  - name: myride-pg
    plan: basic-256mb
    databaseName: myride
    user: myride

services:
  # -------------------------------------------------------------------------
  # A) Legacy Express + SQLite SPA
  # -------------------------------------------------------------------------
  - type: web
    name: my-ride
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: SQLITE_PATH
        value: /var/data/myride.sqlite
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: EXTRA_APP_ORIGINS
        sync: false

  # -------------------------------------------------------------------------
  # B) Path A — FastAPI ecosystem hub (Docker)
  # -------------------------------------------------------------------------
  - type: web
    name: my-ride-ecosystem
    runtime: docker
    plan: starter
    dockerfilePath: ./ecosystem/backend/Dockerfile
    dockerContext: ./ecosystem/backend
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: info
      - key: STRIPE_CURRENCY
        value: zar
      - key: USE_POSTGRES_PRIMARY
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: myride-pg
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: myride-redis
          type: redis
          property: connectionString
      # Defaults match current Render hostname; override if custom domain is attached.
      # App also derives HTTPS from RENDER_EXTERNAL_URL when these are empty/localhost.
      - key: PUBLIC_BASE_URL
        value: https://my-ride-ecosystem.onrender.com
      - key: CORS_ORIGINS
        value: https://my-ride-ecosystem.onrender.com
      - key: ALLOW_DEMO_ACCOUNTS
        value: "true"
      - key: STRIPE_LIVE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: STRIPE_TEST_SECRET_KEY
        sync: false

  - type: redis
    name: myride-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # internal only
