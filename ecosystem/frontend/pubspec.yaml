name: my_ride
description: My Ride e-hailing mobile app (Flutter) — Rider & Driver
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  go_router: ^14.6.2
  provider: ^6.1.2
  google_maps_flutter: ^2.10.0
  google_maps_flutter_web: ^0.5.10
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  firebase_messaging: ^15.1.6
  firebase_crashlytics: ^4.3.10
  cloud_firestore: ^5.6.0
  flutter_stripe: ^11.3.0
  http: ^1.2.2
  dio: ^5.7.0
  socket_io_client: ^3.0.2
  web_socket_channel: ^3.0.1
  connectivity_plus: ^6.1.0
  flutter_screenutil: ^5.9.3
  flutter_riverpod: ^2.6.1
  riverpod: ^2.6.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  location: ^7.0.1
  flutter_secure_storage: ^9.2.4
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  flutter_dotenv: ^5.2.1
  package_info_plus: ^8.1.2
  flutter_svg: ^2.0.16
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  lottie: ^3.2.0
  animations: ^2.0.11
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/my_ride_wordmark.png
    - assets/brand/my_ride_mark.png
    - assets/brand/my_ride_hero.png
