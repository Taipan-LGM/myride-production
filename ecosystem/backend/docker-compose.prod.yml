# Production stack (self-contained). Do not use the default docker-compose.yml alone in prod.
#
#   cp .env.prod.example .env.prod   # fill secrets
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# See ../../docs/CUTOVER.md

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env.prod
    environment:
      DEBUG: "false"
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: ${DATABASE_URL}
      USE_POSTGRES_PRIMARY: ${USE_POSTGRES_PRIMARY:-true}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      STRIPE_CURRENCY: zar
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    restart: always

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myride}
      POSTGRES_USER: ${POSTGRES_USER:-myride}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Internal network only — not published to host
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always

volumes:
  redis_data_prod:
  postgres_data_prod:
