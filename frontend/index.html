<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>My Ride — E-hailing</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin
    />
    <script src="https://js.stripe.com/v3"></script>
  </head>
  <body>
    <div id="app">
      <div class="topbar">
        <div class="brand">
          <div class="logo" aria-label="My Ride logo">
            <img
              src="/logos/My%20Ride_1.png"
              alt="My Ride"
              width="42"
              height="42"
              loading="eager"
            />
          </div>
          <div class="brand-main">
            <div class="brand-title">My Ride</div>
            <div class="brand-subtitle">E-hailing ecosystem</div>
          </div>
          <div
            class="viewport-toolbar"
            id="viewportToolbar"
            role="toolbar"
            aria-label="Layout preview"
          >
            <span class="viewport-toolbar-label">View</span>
            <button
              type="button"
              class="btn ghost xs viewport-btn"
              data-viewport="pc"
              aria-label="PC view"
            >
              <span class="sr-only">PC</span>
              <svg
                class="viewport-ic"
                viewBox="0 0 24 24"
                width="18"
                height="18"
                aria-hidden="true"
              >
                <path
                  fill="currentColor"
                  d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-5v2h2a1 1 0 1 1 0 2H7a1 1 0 1 1 0-2h2v-2H6a2 2 0 0 1-2-2V5Zm2 0v9h12V5H6Z"
                />
              </svg>
            </button>
            <button
              type="button"
              class="btn ghost xs viewport-btn"
              data-viewport="tablet"
              aria-label="Tablet view"
            >
              <span class="sr-only">Tablet</span>
              <svg
                class="viewport-ic"
                viewBox="0 0 24 24"
                width="18"
                height="18"
                aria-hidden="true"
              >
                <path
                  fill="currentColor"
                  d="M7 2a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H7Zm0 2h10v16H7V4Zm5 15.5a1 1 0 1 0 0 2a1 1 0 0 0 0-2Z"
                />
              </svg>
            </button>
            <button
              type="button"
              class="btn ghost xs viewport-btn"
              data-viewport="phone"
              aria-label="Phone view"
            >
              <span class="sr-only">Phone</span>
              <svg
                class="viewport-ic"
                viewBox="0 0 24 24"
                width="18"
                height="18"
                aria-hidden="true"
              >
                <path
                  fill="currentColor"
                  d="M9 1h6a2 2 0 0 1 2 2v18a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2Zm0 2v18h6V3H9Zm3 16.5a1 1 0 1 0 0 2a1 1 0 0 0 0-2Z"
                />
              </svg>
            </button>
          </div>
        </div>

        <div class="topbar-actions">
          <a class="btn ghost nav-link" data-tab="admin" data-role="admin" href="#/admin">Admin</a>
          <a class="btn ghost nav-link" data-tab="driver" data-role="driver" href="#/driver">Driver</a>
          <a class="btn ghost nav-link" data-tab="customer" data-role="customer" href="#/customer">Book a ride</a>
          <a class="btn ghost nav-link" data-tab="home" data-role="home" href="#/">Home</a>
          <button class="btn" id="btnLogout" style="display: none">Logout</button>
        </div>
      </div>

      <div class="container">
        <div id="toast" class="toast" style="display:none;"></div>

        <div id="view"></div>

        <div class="footer">
          <div class="muted">
            © <span id="year"></span> My Ride. Built for test mode (Stripe).
          </div>
          <div class="muted">
            API: <code id="apiBase"></code>
          </div>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/vendor/jsQR.js"></script>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      crossorigin
    ></script>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
